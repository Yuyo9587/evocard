<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Estudio Evocard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{--negro:#0B0B0C;--marfil:#F8F5EF;--dorado:#C9A45C;--gris:#6B6660;--linea:#E4DDD0;--panel:#FFFFFF;--suave:#F2EDE4;--rojo:#A0453C}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"DM Sans",system-ui,sans-serif;font-size:15px;color:var(--negro);background:var(--marfil)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}

/* Entrada con contraseña */
#puerta{position:fixed;inset:0;display:grid;place-items:center;background:var(--negro);z-index:100;padding:20px}
#puerta form{background:var(--marfil);border-radius:14px;padding:32px 28px;width:min(360px,100%);display:grid;gap:14px;text-align:center}
#puerta h1{font-family:"Cormorant Garamond",serif;font-size:2.2rem;font-weight:600}
#puerta h1 span{color:var(--dorado)}
#puerta input{border:1px solid var(--linea);border-radius:8px;padding:11px 12px;width:100%;background:#fff;text-align:center}
#puertaErr{color:var(--rojo);font-size:.85rem;min-height:1.2em}

/* Armado general */
.app{display:grid;grid-template-columns:minmax(360px,460px) 1fr;height:100vh}
.lado{display:flex;flex-direction:column;border-right:1px solid var(--linea);background:var(--panel);min-height:0}
.cabeza{padding:14px 18px 10px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px;justify-content:space-between}
.marca{font-family:"Cormorant Garamond",serif;font-size:1.5rem;font-weight:600;line-height:1}
.marca span{color:var(--dorado)}
.guardado{font-size:.75rem;color:var(--gris)}
.pestanas{display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px;border-bottom:1px solid var(--linea);background:var(--suave)}
.pestanas button{border:0;background:transparent;padding:7px 10px;border-radius:999px;cursor:pointer;font-size:.85rem;color:var(--gris)}
.pestanas button[aria-selected="true"]{background:var(--negro);color:var(--marfil)}
#panel{overflow:auto;padding:18px 18px 60px;flex:1}
.grupo{border:1px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:14px;display:grid;gap:12px}
.grupo > h3{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dorado);font-weight:600}
.ayuda{font-size:.82rem;color:var(--gris);line-height:1.45}
.f{display:grid;gap:5px}
.f > label,.f > span{font-size:.82rem;font-weight:500}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=time],.f input[type=url],.f select,.f textarea{border:1px solid var(--linea);border-radius:8px;padding:8px 10px;width:100%;background:#fff}
.f textarea{resize:vertical;min-height:60px}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color{display:flex;align-items:center;gap:10px;justify-content:space-between}
.color label{font-size:.85rem}
.color input[type=color]{width:46px;height:32px;border:1px solid var(--linea);border-radius:8px;padding:2px;background:#fff;cursor:pointer;flex:none}
.color .der{display:flex;align-items:center;gap:8px}
.color small{font-size:.72rem;color:var(--gris);font-variant-numeric:tabular-nums;width:58px;text-align:right}
.rango{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.rango > span{grid-column:1/-1;font-size:.82rem;font-weight:500}
.rango output{font-size:.78rem;color:var(--gris);min-width:44px;text-align:right}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--negro)}
.b{border:1px solid var(--negro);background:var(--negro);color:var(--marfil);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:.85rem;font-weight:500}
.b.out{background:transparent;color:var(--negro)}
.b.oro{background:var(--dorado);border-color:var(--dorado);color:var(--negro)}
.b.chico{padding:6px 12px;font-size:.8rem}
.b:disabled{opacity:.5;cursor:default}
.botones{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--linea);background:#fff;border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;font-size:.8rem}
.chip i{display:flex;width:34px;height:20px;border-radius:999px;overflow:hidden;border:1px solid rgba(0,0,0,.1)}
.chip i b{flex:1}
.miniatura{display:flex;gap:10px;align-items:center}
.miniatura img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--linea);background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px}
.miniatura .vacia{width:64px;height:64px;border-radius:8px;border:1px dashed var(--linea);display:grid;place-items:center;font-size:.7rem;color:var(--gris);text-align:center}
.aviso{background:#FFF6E0;border:1px solid #EBD9A6;border-radius:10px;padding:10px 12px;font-size:.82rem;line-height:1.45}
.aviso.mal{background:#FBEAE7;border-color:#E9C0B9}

/* Secciones */
.sec{border:1px solid var(--linea);border-radius:12px;margin-bottom:10px;background:#fff}
.sec.apagada{opacity:.55}
.sec-cab{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.sec-cab .nom{flex:1;font-weight:500;font-size:.92rem}
.sec-cab .tipo{font-size:.72rem;color:var(--gris)}
.sec-cab button{border:1px solid var(--linea);background:#fff;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:.85rem;line-height:1;flex:none}
.sec-cab button:disabled{opacity:.3;cursor:default}
.sec-cuerpo{padding:4px 12px 14px;display:grid;gap:12px;border-top:1px solid var(--linea)}
.item{border:1px dashed var(--linea);border-radius:10px;padding:10px;display:grid;gap:8px;position:relative}
.item .quitar{position:absolute;top:6px;right:6px;border:0;background:transparent;cursor:pointer;color:var(--rojo);font-size:.78rem}
.galeria-ed{display:flex;flex-wrap:wrap;gap:8px}
.galeria-ed div{position:relative}
.galeria-ed img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.galeria-ed button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--rojo);color:#fff;cursor:pointer;font-size:.75rem}

/* Vista previa */
.vista{display:flex;flex-direction:column;align-items:center;min-height:0;padding:14px 20px 20px;overflow:auto;background:radial-gradient(circle at 50% 0,#fff,#EFE9DE 70%)}
.vista-barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.vista-barra .peso{font-size:.78rem;color:var(--gris)}
.celular{width:390px;height:min(800px,calc(100vh - 90px));min-height:520px;border-radius:44px;background:#111;padding:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5);flex:none}
.celular iframe{width:100%;height:100%;border:0;border-radius:34px;background:#fff;display:block}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--negro);color:var(--marfil);padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:90;max-width:90vw;text-align:center}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.lado{height:auto;border-right:0}#panel{max-height:none}.celular{width:min(390px,100%);height:720px}}
</style>
</head>
<body>

<div id="puerta">
  <form id="puertaForm">
    <h1>Estudio <span>Evocard</span></h1>
    <p class="ayuda">Esta parte es solo para vos.</p>
    <input type="password" id="clave" placeholder="Contraseña" autocomplete="current-password" autofocus>
    <button class="b" type="submit">Entrar</button>
    <p id="puertaErr" role="alert"></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="lado">
    <div class="cabeza">
      <p class="marca">Estudio <span>Evocard</span></p>
      <span class="guardado" id="guardado"></span>
    </div>
    <nav class="pestanas" id="pestanas" role="tablist"></nav>
    <div id="panel"></div>
  </aside>
  <main class="vista">
    <div class="vista-barra">
      <button class="b out chico" type="button" id="verSobre">Ver cómo se abre el sobre</button>
      <button class="b chico" type="button" id="descargarArriba">Descargar invitación</button>
      <span class="peso" id="peso"></span>
    </div>
    <div class="celular"><iframe id="previa" title="Vista previa de la invitación"></iframe></div>
  </main>
</div>
<input type="file" id="abrirFicha" accept=".json,application/json" hidden>
<div id="toast" hidden role="status"></div>

<script>
/* ===== Piezas compartidas con todos los modelos (vienen de base.py y album.py; no se tocan acá) ===== */
const BASE = {"CSS_BASE": "\n*{box-sizing:border-box}\nhtml,body{background:var(--bg);color:var(--ink)}\nbody{margin:0;font-family:var(--f-body);font-size:var(--fs,19px);line-height:1.55}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}\n#deco{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}\nmain,footer{position:relative;z-index:1}\nbutton,input,select,textarea{font:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}\nh1,h2,h3,p{margin:0}\n.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\nsection{padding-block:56px;text-align:center}\n.banda{background:var(--banda)}\n.lab{font-family:var(--f-sans);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--hl)}\nh2{font-family:var(--f-title);font-weight:var(--title-w,400);font-size:var(--h2,2.9rem);line-height:1.1;margin-top:6px;color:var(--ink)}\n.sub{color:var(--muted);font-style:var(--sub-style,italic);margin-top:10px}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-sans);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;padding:12px 22px;border-radius:var(--r-btn,999px);border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);cursor:pointer;text-decoration:none;font-weight:500}\n.btn.out{background:transparent;color:var(--acc)}\n.ribbon{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ribbon-bg);color:var(--ribbon-ink);font-family:var(--f-sans);font-size:.72rem;letter-spacing:.06em;text-align:center;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card,18px);padding:28px 22px;margin-top:26px}\n\n/* Sobre */\n#sobre{position:fixed;inset:0;z-index:50;background:var(--sobre-bg);display:grid;place-items:center;padding:24px;cursor:pointer;transition:opacity .8s ease, visibility .8s}\n#sobre.abierto{opacity:0;visibility:hidden}\n.env{position:relative;width:min(360px,88vw);aspect-ratio:1.5;max-width:100%}\n.env .back{position:absolute;inset:0;background:var(--env-back);border-radius:8px;box-shadow:0 30px 60px -26px rgba(0,0,0,.45)}\n.env .front{position:absolute;inset:0;border-radius:8px;overflow:hidden}\n.env .front::before,.env .front::after{content:\"\";position:absolute;bottom:0;width:60%;height:100%;background:var(--env-front)}\n.env .front::before{left:0;clip-path:polygon(0 0,100% 62%,100% 100%,0 100%)}\n.env .front::after{right:0;clip-path:polygon(100% 0,0 62%,0 100%,100% 100%)}\n.env .flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--env-flap);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease}\n#sobre.abriendo .flap{transform:rotateX(180deg)}\n.env .seal{position:absolute;left:50%;top:58%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--seal-bg);display:grid;place-items:center;color:var(--seal-ink);font-family:var(--seal-font);font-size:var(--seal-fs,1.9rem);line-height:1;white-space:nowrap;box-shadow:0 6px 14px -6px rgba(0,0,0,.45);transition:transform .4s ease, opacity .4s}\n#sobre.abriendo .seal{transform:scale(.4);opacity:0}\n.env .to{position:absolute;left:0;right:0;bottom:11%;text-align:center;font-family:var(--f-body);font-style:italic;color:var(--env-ink);font-size:1.05rem}\n.tap{margin-top:28px;font-family:var(--f-sans);font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--tap);text-align:center;animation:pulse 2s infinite}\n@keyframes pulse{50%{opacity:.4}}\n@media (prefers-reduced-motion: reduce){.tap{animation:none}.env .flap,.env .seal,#sobre{transition:none}}\n\n/* Música */\n#musica{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:45;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card-solid);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}\n#musica svg{width:20px;height:20px;fill:none;stroke:var(--acc);stroke-width:1.6}\n\n/* Portada */\n.portada{padding-block:92px 60px}\n.saludo{font-family:var(--f-sans);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}\n.fecha-grande{font-family:var(--f-sans);letter-spacing:.3em;font-size:.95rem;text-transform:uppercase;border-block:1px solid var(--line);display:inline-block;padding:10px 4px}\n.invita{max-width:32ch;margin:22px auto 0;font-style:var(--sub-style,italic);color:var(--muted)}\n\n/* Cuenta regresiva */\n.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:26px auto 24px}\n.cd div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 4px;display:grid;gap:2px}\n.cd b{font-family:var(--f-num);font-weight:var(--num-w,500);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}\n.cd small{font-family:var(--f-sans);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}\n\n/* Cronograma */\n.timeline{list-style:none;margin:30px auto 0;padding:0;display:grid;text-align:left;max-width:440px}\n.timeline li{display:grid;grid-template-columns:72px 1fr;gap:16px;padding-bottom:24px;position:relative}\n.timeline li::before{content:\"\";position:absolute;left:83px;top:10px;bottom:-4px;width:1px;background:var(--line)}\n.timeline li:last-child::before{display:none}\n.timeline .h{font-family:var(--f-sans);font-size:.9rem;letter-spacing:.06em;color:var(--hl);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}\n.timeline .t{padding-left:16px;position:relative}\n.timeline .t::before{content:\"\";position:absolute;left:-7px;top:9px;width:9px;height:9px;border-radius:var(--dot-r,50%);background:var(--bg);border:1.5px solid var(--hl)}\n.timeline h3{font-family:var(--f-body);font-weight:600;font-size:1.2rem}\n.timeline p{color:var(--muted);font-size:1rem}\n.timeline a,.lugar a{font-family:var(--f-sans);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);display:inline-block;margin-top:6px}\n\n/* Datos para copiar */\n.datos{display:grid;gap:10px;text-align:left;margin-top:16px}\n.dato{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding-block:8px;min-width:0}\n.dato span:first-child{font-family:var(--f-sans);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}\n.dato b{font-weight:500;word-break:break-all}\n.copiar{font-family:var(--f-sans);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;background:var(--acc-soft);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;color:var(--acc);flex-shrink:0}\n.lista{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px;text-align:left}\n.lista li{display:flex;gap:12px;align-items:baseline}\n.lista li::before{content:var(--bullet,\"•\");color:var(--hl);flex:none}\n\n/* Confirmación */\nform{display:grid;gap:18px;text-align:left;margin-top:8px}\n.campo{display:grid;gap:6px}\n.campo > label,fieldset legend{font-family:var(--f-sans);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:0}\nfieldset{border:0;margin:0;padding:0;display:grid;gap:6px}\n.choices{display:flex;gap:8px;flex-wrap:wrap}\n.choice{position:relative}\n.choice input{position:absolute;opacity:0}\n.choice span{display:inline-block;padding:9px 16px;border-radius:var(--r-btn,999px);border:1px solid var(--line);background:var(--field);cursor:pointer;font-size:1rem}\n.choice input:checked + span{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}\n.choice input:focus-visible + span{outline:2px solid var(--acc);outline-offset:2px}\nselect,textarea,input[type=text]{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--field);width:100%}\n.err{color:var(--err,#A0453C);font-family:var(--f-sans);font-size:.85rem;min-height:1.2em}\n.gracias{display:grid;gap:10px;justify-items:center}\n.gracias h3{font-family:var(--f-title);font-weight:var(--title-w,400);font-size:2.6rem;line-height:1.15}\n.gracias p{color:var(--muted)}\n.fine{font-family:var(--f-sans);font-size:.75rem;color:var(--muted);margin-top:14px}\nfooter{padding-block:40px 90px;text-align:center}\n", "JS_BASE": "\nconst $ = s => document.querySelector(s);\nconst reduce = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n/* ===== PIEZA DE CONEXIÓN (igual en todos los modelos; para Firebase se cambia solo esto) ===== */\nconst Conexion = {\n  activa: () => !!INV.planilla,\n  async invitado(codigo){\n    let r;\n    try{ r = await fetch(INV.planilla + \"?accion=invitado&codigo=\" + encodeURIComponent(codigo)); }\n    catch(e){ throw new Error(\"No pudimos cargar tu invitación. Revisá tu conexión y volvé a abrir el link.\"); }\n    const j = await r.json();\n    if(!j.ok) throw new Error(j.error || \"No encontramos tu invitación.\");\n    return j.invitado;\n  },\n  async confirmar(datos){\n    let r;\n    try{ r = await fetch(INV.planilla, { method:\"POST\", headers:{ \"Content-Type\":\"text/plain;charset=utf-8\" }, body: JSON.stringify(Object.assign({ accion:\"confirmar\" }, datos)) }); }\n    catch(e){ throw new Error(\"No se pudo enviar. Revisá tu conexión e intentá de nuevo.\"); }\n    const j = await r.json();\n    if(!j.ok) throw new Error(j.error || \"No se pudo guardar tu respuesta.\");\n    return j.invitado;\n  }\n};\n/* ============================================================================================ */\n\n/* El código del invitado viene en el link: modelo.html?i=K7PQ2M (o #K7PQ2M) */\nconst CODIGO = (new URLSearchParams(location.search).get(\"i\") || location.hash.slice(1) || \"\").toUpperCase().replace(/[^A-Z0-9]/g, \"\");\nlet respuestaPrevia = null;\n/* Tres modos: \"planilla\" (con panel), \"whatsapp\" (plan Básico: la respuesta se manda por WhatsApp al cliente) y \"muestra\" (demo) */\nconst MODO = INV.planilla ? \"planilla\" : (INV.whatsapp ? \"whatsapp\" : \"muestra\");\nconst plural = (n, a, b) => n + \" \" + (n === 1 ? a : b);\n\nfunction aplicarInvitado(){\n  const generico = !INV.invitado;\n  $(\"#sobreNombre\").textContent = generico ? \"Para vos\" : \"Para \" + INV.invitado;\n  $(\"#saludo\").textContent = generico ? TXT.saludoGenerico : TXT.saludo + \" \" + INV.invitado;\n  $(\"#lugares\").textContent = generico ? TXT.usaLink\n    : `${TXT.reservamos} ${plural(INV.lugares, \"lugar\", \"lugares\")} para ${INV.invitado}.`;\n  $(\"#cant\").innerHTML = Array.from({length: INV.lugares}, (_, i) => `<option value=\"${i+1}\">${plural(i+1, \"persona\", \"personas\")}<\/option>`).join(\"\");\n  $(\"#cant\").value = String(INV.lugares);\n  if($(\"#chicos\")){\n    $(\"#chicos\").innerHTML = Array.from({length: INV.lugares + 1}, (_, i) => `<option value=\"${i}\">${i}<\/option>`).join(\"\");\n    $(\"#chicos\").value = String(Math.min(1, INV.lugares));\n  }\n  const soloFiesta = INV.tipo === \"solo_fiesta\";\n  document.querySelectorAll('[data-parte=\"cena\"]').forEach(li => li.hidden = soloFiesta);\n  if(soloFiesta && $(\"#diaLab\")) $(\"#diaLab\").textContent = TXT.desdeLas + \" \" + INV.horaFiesta;\n  if(generico) $(\"#rsvp\").hidden = true;\n  if(respuestaPrevia && respuestaPrevia.estado !== \"pendiente\"){\n    const r = respuestaPrevia;\n    (r.estado === \"confirmado\" ? $(\"#asisteSi\") : $(\"#asisteNo\")).checked = true;\n    if(r.cantidad) $(\"#cant\").value = String(Math.min(r.cantidad, INV.lugares));\n    if(r.menu && $(\"#menu\")) $(\"#menu\").value = r.menu;\n    $(\"#lugares\").textContent = r.estado === \"confirmado\"\n      ? `${TXT.yaConfirmaste} ${plural(r.cantidad, \"lugar\", \"lugares\")}. ${TXT.siCambio}`\n      : `${TXT.yaNoVienen} ${TXT.siCambio}`;\n  }\n  mostrarCampos();\n}\n\nasync function iniciarInvitado(){\n  if(MODO === \"whatsapp\"){\n    $(\"#ribbon\").hidden = true;\n    INV.invitado = \"\"; INV.lugares = INV.maxLugares || 6;\n    aplicarInvitado();\n    $(\"#rsvp\").hidden = false; $(\"#campoNombre\").hidden = false; $(\"#finePersonal\").hidden = true;\n    $(\"#cant\").value = \"1\";\n    $(\"#lugares\").textContent = TXT.porWhatsapp;\n    return;\n  }\n  if(!Conexion.activa()){ aplicarInvitado(); return; }   /* muestra con datos de ejemplo */\n  $(\"#ribbon\").hidden = true;\n  if(!CODIGO){ INV.invitado = \"\"; INV.lugares = 1; aplicarInvitado(); return; }\n  INV.invitado = \"\"; aplicarInvitado();\n  try{\n    const g = await Conexion.invitado(CODIGO);\n    INV.invitado = g.nombre; INV.lugares = Number(g.lugares) || 1; INV.tipo = g.tipo;\n    respuestaPrevia = g;\n    $(\"#rsvp\").hidden = false;\n    aplicarInvitado();\n  }catch(e){\n    $(\"#sobreNombre\").textContent = \"Invitación no encontrada\";\n    $(\"#lugares\").textContent = e.message;\n  }\n}\n\n/* Agendar en Google Calendar */\n(function(){\n  const f = d => new Date(d).toISOString().replace(/[-:]/g, \"\").replace(/\\.\\d{3}/, \"\");\n  $(\"#agendar\").href = \"https://calendar.google.com/calendar/render?action=TEMPLATE\"\n    + \"&text=\" + encodeURIComponent(INV.titulo)\n    + \"&dates=\" + f(INV.fechaEvento) + \"/\" + f(INV.fechaFin)\n    + \"&location=\" + encodeURIComponent(INV.lugarAgenda);\n})();\n\n/* Cuenta regresiva */\nconst meta = new Date(INV.fechaEvento).getTime();\nfunction tick(){\n  let ms = Math.max(0, meta - Date.now());\n  const d = Math.floor(ms / 864e5); ms -= d * 864e5;\n  const h = Math.floor(ms / 36e5); ms -= h * 36e5;\n  const m = Math.floor(ms / 6e4); ms -= m * 6e4;\n  const s = Math.floor(ms / 1e3);\n  $(\"#cdD\").textContent = d; $(\"#cdH\").textContent = String(h).padStart(2, \"0\");\n  $(\"#cdM\").textContent = String(m).padStart(2, \"0\"); $(\"#cdS\").textContent = String(s).padStart(2, \"0\");\n}\ntick(); setInterval(tick, 1000);\n\n/* Música generada en el navegador */\nlet audio = null, sonando = false, timer = null;\nfunction iniciarMusica(){\n  try{\n    audio = audio || new (window.AudioContext || window.webkitAudioContext)();\n    if(audio.state === \"suspended\") audio.resume();\n    let i = 0;\n    const tocar = () => {\n      if(!sonando) return;\n      const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();\n      o.type = MUSICA.onda; o.frequency.value = MUSICA.notas[i % MUSICA.notas.length];\n      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(MUSICA.volumen, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0006, t + MUSICA.cola);\n      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + MUSICA.cola + 0.1); i++;\n    };\n    sonando = true; tocar(); timer = setInterval(tocar, MUSICA.paso);\n  }catch(e){ sonando = false; }\n  pintarBoton();\n}\nfunction pararMusica(){ sonando = false; clearInterval(timer); pintarBoton(); }\nfunction pintarBoton(){\n  $(\"#musica\").setAttribute(\"aria-label\", sonando ? \"Silenciar música\" : \"Activar música\");\n  $(\"#musIcon\").innerHTML = sonando\n    ? '<path d=\"M9 18V6l10-2v12\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><circle cx=\"16\" cy=\"16\" r=\"3\"/>'\n    : '<path d=\"M9 18V6l10-2v12\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><circle cx=\"16\" cy=\"16\" r=\"3\"/><path d=\"M3 3l18 18\"/>';\n}\n$(\"#musica\").addEventListener(\"click\", () => sonando ? pararMusica() : iniciarMusica());\n\n/* Abrir el sobre */\nfunction abrir(){\n  const s = $(\"#sobre\"); if(s.classList.contains(\"abriendo\")) return;\n  s.classList.add(\"abriendo\");\n  $(\"#musica\").hidden = false;\n  iniciarMusica();\n  setTimeout(() => s.classList.add(\"abierto\"), reduce ? 0 : 750);\n}\n$(\"#sobre\").addEventListener(\"click\", abrir);\n$(\"#sobre\").addEventListener(\"keydown\", e => { if(e.key === \"Enter\" || e.key === \" \"){ e.preventDefault(); abrir(); } });\n\n/* Copiar datos */\ndocument.querySelectorAll(\"[data-copy]\").forEach(b => b.addEventListener(\"click\", () => {\n  const el = $(\"#\" + b.dataset.copy), txt = el.textContent, msg = $(\"#copyMsg\");\n  const ok = () => { msg.style.color = \"var(--acc)\"; msg.textContent = \"Copiado: \" + txt; };\n  const manual = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.style.color = \"var(--muted)\"; msg.textContent = \"Quedó seleccionado. Copialo desde el menú del celular.\"; };\n  try{ navigator.clipboard.writeText(txt).then(ok, manual); }catch(e){ manual(); }\n}));\n\n/* Confirmación */\nfunction mostrarCampos(){\n  const no = $(\"#asisteNo\").checked;\n  document.querySelectorAll(\"[data-si]\").forEach(el => el.hidden = no);\n}\ndocument.querySelectorAll('input[name=\"asiste\"]').forEach(r => r.addEventListener(\"change\", mostrarCampos));\n$(\"#rsvp\").addEventListener(\"submit\", async e => {\n  e.preventDefault();\n  const asiste = (document.querySelector('input[name=\"asiste\"]:checked') || {}).value;\n  if(!asiste){ $(\"#rsvpErr\").textContent = TXT.elegi; return; }\n  $(\"#rsvpErr\").textContent = \"\";\n  const cant = $(\"#cant\").value;\n  /* Campos propios del modelo: se suman al mensaje para que se vean en el panel */\n  const extras = asiste === \"si\" ? [...document.querySelectorAll(\"[data-extra]\")].map(el => {\n    const v = (el.value || \"\").trim(); return v ? el.dataset.extra + \": \" + v : \"\";\n  }).filter(Boolean) : [];\n  const mensaje = [$(\"#mensaje\").value.trim(), ...extras].filter(Boolean).join(\"\\n\");\n  const boton = $(\"#rsvp\").querySelector('button[type=\"submit\"]');\n  if(MODO === \"whatsapp\"){\n    const quien = $(\"#nombreInv\").value.trim();\n    if(!quien){ $(\"#rsvpErr\").textContent = TXT.faltaNombre; $(\"#nombreInv\").focus(); return; }\n    const lineas = asiste === \"si\"\n      ? [`¡Hola! Confirmo asistencia a ${INV.titulo}.`, `Nombre: ${quien}`, `Vamos: ${cant === \"1\" ? \"1 persona\" : cant + \" personas\"}`,\n         $(\"#menu\") && $(\"#menu\").value !== \"Ninguno\" ? `Menú especial: ${$(\"#menu\").value}` : \"\", ...extras]\n      : [`¡Hola! Lamentablemente no vamos a poder ir a ${INV.titulo}.`, `Nombre: ${quien}`];\n    if($(\"#mensaje\").value.trim()) lineas.push(`Mensaje: ${$(\"#mensaje\").value.trim()}`);\n    const url = `https://wa.me/${INV.whatsapp}?text=${encodeURIComponent(lineas.filter(Boolean).join(\"\\n\"))}`;\n    window.open(url, \"_blank\", \"noopener\");\n    $(\"#rsvpCard\").innerHTML = `<div class=\"gracias\"><h3>${asiste === \"si\" ? TXT.graciasSi : TXT.graciasNo}<\/h3><p>${TXT.abrioWhatsapp}<\/p><a class=\"btn out\" target=\"_blank\" rel=\"noopener\" href=\"${url}\">Abrir WhatsApp<\/a><\/div>`;\n    return;\n  }\n  const real = Conexion.activa();\n  if(real){\n    boton.disabled = true; boton.textContent = \"Enviando…\";\n    try{\n      await Conexion.confirmar({ codigo: CODIGO, asiste, cantidad: cant, menu: $(\"#menu\") && asiste === \"si\" ? $(\"#menu\").value : \"\", traslado: \"no\", mensaje });\n    }catch(err){\n      $(\"#rsvpErr\").textContent = err.message; boton.disabled = false; boton.textContent = \"Enviar confirmación\"; return;\n    }\n  }\n  const nota = real ? \"\" : `<p class=\"fine\">En la invitación real, esta respuesta ${TXT.nota} al instante en el panel.<\/p>`;\n  const nombre = document.createElement(\"span\"); nombre.textContent = INV.invitado;\n  $(\"#rsvpCard\").innerHTML = asiste === \"si\"\n    ? `<div class=\"gracias\"><h3>${TXT.graciasSi}<\/h3><p>${TXT.confirmaste} ${cant === \"1\" ? \"1 lugar\" : cant + \" lugares\"} para ${nombre.innerHTML}. ${TXT.siCambio}<\/p>${nota}<\/div>`\n    : `<div class=\"gracias\"><h3>${TXT.graciasNo}<\/h3><p>${TXT.graciasNoP}<\/p>${nota}<\/div>`;\n});\n", "ESQUELETO": "<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}<\/style>\n<\/head>\n<body>\n", "ALBUM_CSS": "\n/* Álbum de fotos */\n.album-card{text-align:center}\n.album-card .campo{text-align:left;margin-bottom:16px}\n.album-card input[type=text]{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:transparent}\n.album-barra{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:16px auto 0;max-width:320px}\n.album-barra i{display:block;height:100%;width:0;background:var(--acc,var(--leaf,var(--lila)));transition:width .3s}\n", "ALBUM_JS": "\n/* ===== Álbum de fotos: los invitados suben sus fotos a la carpeta del evento ===== */\n(function(){\n  const sec = $(\"#album\"); if(!sec) return;\n  if(INV.albumActivo === false){ sec.hidden = true; return; }\n  const btn = $(\"#albumBtn\"), input = $(\"#albumArchivos\"), msg = $(\"#albumMsg\"), barra = $(\"#albumBarra\"), prog = $(\"#albumProg\");\n  const real = !!INV.planilla;\n  if(!real && INV.album){   /* sin planilla, pero con un álbum externo (por ejemplo Google Fotos) */\n    $(\"#albumAutorCampo\").hidden = true; btn.textContent = \"Abrir el álbum\";\n    btn.addEventListener(\"click\", () => window.open(INV.album, \"_blank\", \"noopener\")); return;\n  }\n  btn.addEventListener(\"click\", () => input.click());\n  async function achicar(archivo){\n    const url = URL.createObjectURL(archivo);\n    try{\n      const img = await new Promise((ok, mal) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => mal(new Error(\"No se pudo leer la foto.\")); im.src = url; });\n      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));\n      const c = document.createElement(\"canvas\"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);\n      c.getContext(\"2d\").drawImage(img, 0, 0, c.width, c.height);\n      return c.toDataURL(\"image/jpeg\", 0.82).split(\",\")[1];\n    } finally { URL.revokeObjectURL(url); }\n  }\n  input.addEventListener(\"change\", async () => {\n    const archivos = [...input.files].filter(f => /^image\\//.test(f.type) || /\\.(jpe?g|png|heic|heif|webp)$/i.test(f.name)); input.value = \"\";\n    if(!archivos.length) return;\n    if(!real){ msg.textContent = `Elegiste ${archivos.length === 1 ? \"1 foto\" : archivos.length + \" fotos\"}. En la invitación real se suben al álbum del evento y se ven en el panel.`; return; }\n    btn.disabled = true; barra.hidden = false; let subidas = 0, fallas = 0, aviso = \"\";\n    for(let i = 0; i < archivos.length; i++){\n      msg.textContent = `Subiendo ${i + 1} de ${archivos.length}…`; prog.style.width = (i / archivos.length * 100) + \"%\";\n      try{\n        const datos = await achicar(archivos[i]);\n        await Conexion.subirFoto({ tipo:\"image/jpeg\", datos, autor: $(\"#albumAutor\").value.trim() || INV.invitado || \"\" });\n        subidas++;\n      }catch(e){ fallas++; if(/cerrado|lleno/.test(e.message)){ aviso = e.message; break; } }\n    }\n    prog.style.width = \"100%\"; btn.disabled = false; setTimeout(() => barra.hidden = true, 1500);\n    msg.textContent = aviso || (subidas\n      ? `¡Gracias! ${subidas === 1 ? \"Se subió 1 foto\" : \"Se subieron \" + subidas + \" fotos\"} al álbum.` + (fallas ? ` ${fallas === 1 ? \"Una no se pudo subir\" : fallas + \" no se pudieron subir\"}: probá de nuevo con esas.` : \"\")\n      : \"No se pudo subir. Revisá tu conexión e intentá de nuevo.\");\n  });\n  /* El QR de las mesas abre la invitación con ?album: saltea el sobre y va directo a esta sección */\n  if(new URLSearchParams(location.search).has(\"album\")){\n    const s = $(\"#sobre\"); s.classList.add(\"abriendo\", \"abierto\"); $(\"#musica\").hidden = false;\n    setTimeout(() => sec.scrollIntoView({ block:\"start\" }), 150);\n  }\n})();\n", "CONEXION_FOTO": ",\n  async subirFoto(datos){\n    let r;\n    try{ r = await fetch(INV.planilla, { method:\"POST\", headers:{ \"Content-Type\":\"text/plain;charset=utf-8\" }, body: JSON.stringify(Object.assign({ accion:\"subirFoto\" }, datos)) }); }\n    catch(e){ throw new Error(\"No se pudo subir. Revisá tu conexión e intentá de nuevo.\"); }\n    const j = await r.json();\n    if(!j.ok) throw new Error(j.error || \"No se pudo subir la foto.\");\n    return j.foto;\n  }\n};", "ALBUM_HTML": "  <section id=\"album\">\n    <div class=\"wrap\">\n      <span class=\"lab\">Álbum de la fiesta<\/span>\n      <h2>Compartí tus fotos<\/h2>\n      <p class=\"sub\">Durante la fiesta, subí acá tus fotos. Todas van a un mismo álbum para que nadie se pierda nada.<\/p>\n      <div class=\"card album-card\">\n        <input type=\"file\" id=\"albumArchivos\" accept=\"image/*\" multiple hidden>\n        <div class=\"campo\" id=\"albumAutorCampo\">\n          <label for=\"albumAutor\">Tu nombre (opcional)<\/label>\n          <input type=\"text\" id=\"albumAutor\" maxlength=\"60\" autocomplete=\"name\">\n        <\/div>\n        <button class=\"btn\" type=\"button\" id=\"albumBtn\">Subir mis fotos<\/button>\n        <div class=\"album-barra\" id=\"albumBarra\" hidden><i id=\"albumProg\"><\/i><\/div>\n        <p class=\"fine\" id=\"albumMsg\" role=\"status\"><\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n"};

/* ===== Contraseña (es un "no pasar", no una cerradura: alcanza para que nadie entre por curiosidad) =====
   Para cambiarla, pedile a Claude que actualice CLAVE_HUELLA. */
const CLAVE_HUELLA = "b27a0ff1";
function huella(t){ let h = 0x811c9dc5; for(const ch of "evocard|" + t){ h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, "0"); }
const guardar = { leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, poner(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } } };
function entrar(){ document.getElementById("puerta").remove(); document.getElementById("app").hidden = false; iniciar(); }
document.getElementById("puertaForm").addEventListener("submit", e => {
  e.preventDefault();
  if(huella(document.getElementById("clave").value.trim()) === CLAVE_HUELLA){ try{ sessionStorage.setItem("evoEstudio", "1"); }catch(err){} entrar(); }
  else document.getElementById("puertaErr").textContent = "Esa no es la contraseña.";
});

/* Lee un .zip (como los que se bajan de DaFont) y saca las letras que tenga adentro */
async function letrasDelZip(buf){
  const v = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let fin = -1; for(let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--){ if(v.getUint32(i, true) === 0x06054b50){ fin = i; break; } }
  if(fin < 0) throw new Error("No pude abrir ese .zip.");
  const total = v.getUint16(fin + 10, true); let pos = v.getUint32(fin + 16, true); const salida = [];
  for(let k = 0; k < total; k++){
    if(v.getUint32(pos, true) !== 0x02014b50) break;
    const metodo = v.getUint16(pos + 10, true), tam = v.getUint32(pos + 20, true), largoNom = v.getUint16(pos + 28, true),
          largoExtra = v.getUint16(pos + 30, true), largoCom = v.getUint16(pos + 32, true), local = v.getUint32(pos + 42, true);
    const nombre = dec.decode(u8.subarray(pos + 46, pos + 46 + largoNom));
    pos += 46 + largoNom + largoExtra + largoCom;
    const ext = (nombre.split(".").pop() || "").toLowerCase();
    if(!FORMATOS_LETRA[ext] || /(^|\/)(__MACOSX|\._)/.test(nombre)) continue;
    const ini = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
    let datos = u8.slice(ini, ini + tam);
    if(metodo === 8){ datos = new Uint8Array(await new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()); }
    else if(metodo !== 0) continue;
    salida.push({ archivo: nombre.split("/").pop(), ext, datos });
  }
  return salida;
}
const aDataURL = (bytes, tipo) => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(new Blob([bytes], { type: tipo })); });
async function cargarLetras(archivos){
  let agregadas = 0, avisos = [];
  for(const a of archivos){
    const ext = (a.name.split(".").pop() || "").toLowerCase();
    let piezas = [];
    try{
      if(ext === "zip") piezas = await letrasDelZip(await a.arrayBuffer());
      else if(FORMATOS_LETRA[ext]) piezas = [{ archivo: a.name, ext, datos: new Uint8Array(await a.arrayBuffer()) }];
      else { avisos.push(a.name + " no es una letra (tiene que ser .ttf, .otf, .woff, .woff2 o un .zip)."); continue; }
    }catch(e){ avisos.push(e.message); continue; }
    if(!piezas.length) avisos.push("En " + a.name + " no encontré letras.");
    for(const pz of piezas){
      if(pz.datos.length > 1.5 * 1024 * 1024){ avisos.push(pz.archivo + " pesa demasiado (más de 1,5 MB)."); continue; }
      let nombre = pz.archivo.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").replace(/["\\]/g, "").trim() || "Mi letra";
      if(LETRAS[nombre]) nombre += " (tuya)";
      const datos = await aDataURL(pz.datos, "font/" + pz.ext);
      F.letrasPropias = (F.letrasPropias || []).filter(l => l.nombre !== nombre);
      F.letrasPropias.push({ nombre, formato: FORMATOS_LETRA[pz.ext], datos, parecida: "serif" });
      agregadas++;
    }
  }
  return { agregadas, avisos };
}

const hexRgb = h => { h = (h || "#000000").replace("#", ""); if(h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgbHex = a => "#" + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("").toUpperCase();
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return a >= 1 ? rgbHex([r, g, b]) : `rgba(${r},${g},${b},${+a.toFixed(3)})`; };
const mezcla = (h1, h2, k) => { const a = hexRgb(h1), b = hexRgb(h2); return rgbHex(a.map((v, i) => v * k + b[i] * (1 - k))); };
const aclarar = (h, k) => mezcla("#FFFFFF", h, k), oscurecer = (h, k) => mezcla("#000000", h, k);

    P = Array.from({length: n}, (_, i) => ({ x: R() * W, y: R() * H, s: R(), a: R() * 6.28, va: (R() - .5) * .05, f: R() * 6.28, c: col(i),
      vy: D.tipo === "burbujas" ? -(.2 + R() * .5) : (D.tipo === "confeti" ? .4 + R() * .9 : .15 + R() * .45), vx: (R() - .5) * .3 }));
  }

      for(const k of [.35, .55, .75]){ x.beginPath(); x.arc(cx, cy, r * k, d, h); x.stroke(); } };
    const r = Math.min(W, H) * .42;
    ab(0, 0, 0, Math.PI / 2, r); ab(W, 0, Math.PI / 2, Math.PI, r); ab(0, H, -Math.PI / 2, 0, r); ab(W, H, Math.PI, Math.PI * 1.5, r);
  }
  function dibujar(t){
    t = t || 0; x.clearRect(0, 0, W, H);
    if(quietos){ abanicos(); return; }
    for(const p of P){
      const mover = !reduce;
      if(mover){ p.y += p.vy; p.x += p.vx + (D.tipo === "petalos" || D.tipo === "corazones" ? Math.sin(t / 1400 + p.f) * .35 : 0); p.a += p.va;
        if(p.y > H + 20){ p.y = -20; p.x = Math.random() * W; } if(p.y < -20){ p.y = H + 20; p.x = Math.random() * W; } }

        case "confeti": x.rotate(p.a); if(p.s > .7){ x.beginPath(); x.arc(0, 0, 3 + p.s * 2, 0, 6.28); x.fill(); } else x.fillRect(-3, -5, 6 + p.s * 4, (8 + p.s * 6) * Math.abs(Math.cos(p.a)) + 2); break;
        case "estrellas": x.beginPath(); x.arc(0, 0, .5 + p.s * 1.3, 0, 6.28); x.fill(); break;
        case "destellos": x.rotate(p.a * .2); destello(3 + p.s * 6); break;
        case "petalos": x.rotate(p.a); x.beginPath(); x.ellipse(0, 0, 4 + p.s * 5, 2 + p.s * 2.5, 0, 0, 6.28); x.fill(); break;
        case "corazones": x.rotate(Math.sin(p.a) * .4); corazon(5 + p.s * 6); break;
        case "burbujas": x.lineWidth = 1; x.beginPath(); x.arc(Math.sin(p.f + t / 900) * 3, 0, 3 + p.s * 9, 0, 6.28); x.stroke(); break;

  }
  armar(); addEventListener("resize", () => { armar(); if(reduce || quietos) dibujar(); }); dibujar();

  const plan = modo === "panel" ? (e.planilla || "").trim() : "", wa = modo === "whatsapp" ? String(e.whatsapp || "").replace(/\D/g, "") : "";
  let s = JSON.stringify(o, null, 2).replace(/\n}$/, "");
  s += `,\n  /* Plan Básico (sin planilla): número del cliente que recibe las confirmaciones por WhatsApp, con código de país. Ej: 5491112345678 */\n  "whatsapp": ${JSON.stringify(wa)}`;
  s += `,\n  /* Plan Básico: hasta cuántas personas puede confirmar cada invitado */\n  "maxLugares": ${Number(e.maxLugares) || 6}`;

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
${linksLetras(F)}
<style>
/* Layout: invitación de una columna angosta; un solo tema de color, a propósito (es la estética del evento). */
${cssVariables(F)}
${cssLetrasPropias(F)}
${BASE.CSS_BASE}
${CSS_EXTRA}${sinMusica ? "#musica{display:none!important}\n" : ""}${BASE.ALBUM_CSS}</style>

${im.fondo ? `<div id="fondoImg" aria-hidden="true" style="background-image:url('${im.fondo}');opacity:${im.fondoOp / 100}"></div>\n` : ""}<canvas id="deco" aria-hidden="true"></canvas>

<div id="sobre" role="button" tabindex="0" aria-label="Abrir la invitación">
  <div>
    <div class="env">
      <div class="back"></div>
      <div class="front"></div>
      <div class="flap"></div>
      <div class="seal">${sello}</div>
      <div class="to" id="sobreNombre">Para ${esc(F.evento.invitado)}</div>
    </div>
    <p class="tap">${esc(s.tapTexto || "Tocá para abrir")}</p>
  </div>
</div>

<button id="musica" type="button" aria-label="Activar música" hidden>
  <svg viewBox="0 0 24 24" id="musIcon"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
</button>

${htmlSecciones(F)}

<div class="ribbon" id="ribbon">${esc(cinta)}</div>

<script>
/* ===== DATOS DE LA INVITACIÓN: se cambian por cada cliente ===== */
const INV = ${datosInvitacion(F, modo)};
/* ================================================================ */
const TXT = ${JSON.stringify(TXT_ACTUAL, null, 2)};
const MUSICA = ${sinMusica ? '{ onda:"sine", notas:[0], paso:100000, volumen:0, cola:0.1 }' : MUSICAS[F.musica][1]};
${js}
${sinMusica ? "iniciarMusica = function(){}; pararMusica = function(){};\n" : ""}/* Decoración del fondo */
const DECO = ${JSON.stringify({ tipo: F.deco.tipo, colores: F.deco.colores && F.deco.colores.length ? F.deco.colores : ["#FFFFFF"], cant: F.deco.cant || 1, op: (F.deco.op == null ? 55 : F.deco.op) / 100 })};
${DECO_JS}
${BASE.ALBUM_JS}
iniciarInvitado();
<\/script>
`;
  if(opciones.vista && !opciones.conSobre) cuerpo += `<style>#sobre{display:none!important}</style>\n`;
  return BASE.ESQUELETO + cuerpo + "\n</body>\n</html>\n";
}

/* ===================================================== EDITOR ===================================================== */
let F = null, pestana = "empezar", abierta = null;
const $ = s => document.querySelector(s);
const get = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
const set = (o, p, v) => { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach(k => a = a[k]); a[ks[ks.length - 1]] = v; };
function toast(t, ms = 2600){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms); }

/* Piezas del formulario */
const campo = (p, label, tipo = "text", extra = "") => {
  const v = get(F, p) ?? "";
  if(tipo === "area") return `<div class="f"><label>${label}</label><textarea data-p="${p}" rows="3"${extra}>${esc(v)}</textarea></div>`;
  return `<div class="f"><label>${label}</label><input type="${tipo}" data-p="${p}" value="${esc(v)}"${tipo === "number" ? ' data-num' : ""}${extra}></div>`;
};
const color = (p, label) => `<div class="color"><label>${label}</label><span class="der"><small>${esc(get(F, p))}</small><input type="color" data-p="${p}" value="${esc(get(F, p))}"></span></div>`;
const rango = (p, label, min, max, paso = 1, unidad = "") => { const v = get(F, p); return `<div class="rango"><span>${label}</span><input type="range" data-p="${p}" data-num min="${min}" max="${max}" step="${paso}" value="${v}" data-u="${unidad}"><output>${v}${unidad}</output></div>`; };
const elegir = (p, label, opciones, re = false) => `<div class="f"><label>${label}</label><select data-p="${p}"${re ? " data-re" : ""}>${Object.entries(opciones).map(([k, t]) => `<option value="${esc(k)}"${String(get(F, p)) === String(k) ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></div>`;
const tilde = (p, label, re = false) => `<label class="check"><input type="checkbox" data-p="${p}"${get(F, p) ? " checked" : ""}${re ? " data-re" : ""}> ${label}</label>`;
const grupo = (titulo, cont, ayuda = "") => `<div class="grupo"><h3>${titulo}</h3>${ayuda ? `<p class="ayuda">${ayuda}</p>` : ""}${cont}</div>`;
const listaLetras = () => Object.fromEntries([...(F.letrasPropias || []).map(l => [l.nombre, "★ " + l.nombre + " (tuya)"]), ...Object.keys(LETRAS).map(n => [n, n])]);
const imagen = (p, label, max, formato, ayuda = "") => { const v = get(F, p);
  return `<div class="f"><span>${label}</span><div class="miniatura">${v ? `<img src="${v}" alt="">` : `<div class="vacia">Sin imagen</div>`}<div class="botones"><button class="b out chico" type="button" data-subir="${p}" data-max="${max}" data-fmt="${formato}">${v ? "Cambiar" : "Subir"}</button>${v ? `<button class="b out chico" type="button" data-sacar="${p}">Quitar</button>` : ""}</div></div>${ayuda ? `<p class="ayuda">${ayuda}</p>` : ""}</div>`; };

const PESTANAS = {
  empezar: ["Empezar", () => grupo("Este diseño", campo("nombre", "Nombre del modelo") + `<p class="ayuda">Empezó como: ${esc(F.desde)}.</p>`)
    + grupo("Empezar de nuevo", `<div class="botones"><button class="b out chico" type="button" data-accion="blanco">Nuevo en blanco</button></div>
      <div class="f"><label>O copiar un modelo que ya existe</label><select id="elegirModelo">${Object.entries(MODELOS).map(([k, m]) => `<option value="${k}">${esc(m.nombre)}</option>`).join("")}</select></div>
      <div class="botones"><button class="b out chico" type="button" data-accion="copiar">Copiar este modelo</button></div>`,
      "Se copian colores, letras, sobre, música, adornos y textos. Las funciones especiales (la votación de Revelación, el selector de colores de Brindis, el número grande de Confeti) no se copian. Empezar de nuevo reemplaza lo que tenés ahora: guardá la ficha antes si la querés conservar.")
    + grupo("Guardar y descargar", `<div class="botones"><button class="b chico" type="button" data-accion="guardarFicha">Guardar ficha</button><button class="b out chico" type="button" data-accion="abrirFicha">Abrir una ficha</button></div>
      <p class="ayuda"><b>La ficha</b> es el archivo de trabajo: guarda todo lo que elegiste para seguir editándolo otro día. Lo que hacés también queda guardado solo en esta compu, pero si borrás el historial del navegador se pierde: guardá la ficha.</p>
      <div class="botones"><button class="b oro chico" type="button" data-accion="descargar">Descargar invitación</button></div>
      <p class="ayuda"><b>La invitación</b> es el archivo final (.html) que se sube a GitHub. Antes de descargarla, en la pestaña <b>Datos</b> elegís si es una muestra para la página o la invitación de un cliente.</p>`) ],
  colores: ["Colores", () => grupo("Paletas listas", `<div class="chips">${Object.entries(MODELOS).map(([k, m]) => { const c = m.f.colores; return `<button class="chip" type="button" data-paleta="${k}"><i><b style="background:${c.fondo}"></b><b style="background:${c.principal}"></b><b style="background:${c.texto}"></b></i>${esc(m.nombre)}</button>`; }).join("")}</div>`, "Toca una para usar sus colores. Después podés cambiar cada uno.")
    + grupo("Colores de la invitación", color("colores.fondo", "Fondo") + color("colores.texto", "Texto principal") + color("colores.suave", "Texto suave (frases y aclaraciones)")
      + color("colores.principal", "Color principal (botones)") + color("colores.sobrePrincipal", "Letras dentro de los botones") + color("colores.detalle", "Detalles (títulos chiquitos y horarios)")
      + color("colores.campos", "Fondo de las casillas para escribir") + tilde("colores.oscuro", "Es una invitación de fondo oscuro"))
    + grupo("Bandas (franjas de fondo que se alternan)", color("colores.banda", "Color de las bandas") + elegir("colores.bandaEstilo", "Forma", { lisa: "Franja lisa", degrade: "Se funde con el fondo (suave)" }) + rango("colores.bandaOp", "Intensidad", 0, 100, 1, "%"))
    + grupo("Tarjetas y líneas", color("colores.tarjeta", "Color de las tarjetas") + rango("colores.tarjetaOp", "Qué tan tapada (100% = color lleno; bajo = transparente)", 0, 100, 1, "%")
      + color("colores.lineas", "Líneas y bordes") + rango("colores.lineasOp", "Intensidad de las líneas", 5, 100, 1, "%") + color("colores.error", "Avisos de error")) ],
  letras: ["Letras", () => grupo("Tus letras", `<div class="botones"><button class="b chico" type="button" data-accion="cargarLetra">+ Cargar una letra</button></div>
      ${(F.letrasPropias || []).map((l, i) => `<div class="item"><button class="quitar" type="button" data-quitarletra="${i}">Quitar</button>
        <p style="font-family:${esc(fam(l.nombre))};font-size:1.7rem;line-height:1.2;padding-right:50px">${esc(l.nombre)}</p><p style="font-family:${esc(fam(l.nombre))};font-size:1.1rem">Lucía &amp; Tomás · 14 de marzo · 0123456789</p>
        ${elegir("letrasPropias." + i + ".parecida", "Si el celular no la puede mostrar, usar una", { serif: "clásica (con remates)", cursive: "de firma (manuscrita)", sans: "moderna (sin remates)" })}</div>`).join("")}`,
      "Bajala de la página y cargá el archivo tal cual: sirve el .zip o la letra suelta (.ttf, .otf, .woff, .woff2). Después elegila abajo; aparece con una ★. Ojo: como vendés las invitaciones, usá letras que digan <b>gratis para uso comercial</b> (\"free for commercial use\"). Las de uso personal no se pueden usar en un trabajo que cobrás.")
    + grupo("Tipos de letra", elegir("letras.titulo", "Títulos y nombres", listaLetras()) + elegir("letras.texto", "Textos", listaLetras()) + elegir("letras.detalle", "Detalles (títulos chiquitos, botones)", listaLetras())
      + elegir("letras.numeros", "Números de la cuenta regresiva", { titulo: "Igual que los títulos", texto: "Igual que los textos", detalle: "Igual que los detalles" }))
    + grupo("Tamaños", rango("letras.tamTitulo", "Tamaño de los títulos", 1.6, 4, .1, " rem") + rango("letras.tamTexto", "Tamaño del texto", 15, 21, 1, " px")
      + elegir("letras.tituloPeso", "Grosor de los títulos", { 400: "Normal", 500: "Un poco más grueso", 600: "Grueso", 700: "Muy grueso", 800: "Extra grueso" }) + tilde("letras.cursiva", "Frases en cursiva"),
      "Algunas letras (sobre todo las de firma) tienen un solo grosor: si no cambia, es por eso.")
    + grupo("Formas", rango("forma.botones", "Redondez de los botones", 0, 40, 1, " px") + rango("forma.tarjetas", "Redondez de las tarjetas", 0, 32, 1, " px")
      + elegir("forma.puntos", "Puntitos del cronograma", { circulo: "Círculo", cuadrado: "Cuadradito", rombo: "Rombo" }) + campo("forma.vineta", "Viñeta de las listas (un símbolo: • ★ ♥ ✦ → ◆ ♡)")) ],
  sobre: ["Sobre", () => grupo("Lo que se ve detrás del sobre", elegir("sobre.textura", "Fondo", TEXTURAS, true) + color("sobre.fondo1", "Color 1")
      + (["liso", "imagen"].includes(F.sobre.textura) ? "" : color("sobre.fondo2", "Color 2")) + (F.sobre.textura === "imagen" ? imagen("sobre.imagen", "Imagen del fondo", 1400, "jpeg") : ""))
    + grupo("El sobre", color("sobre.color", "Color del sobre") + `<p class="ayuda">Al cambiarlo se ajustan solos el frente y la solapa. Si querés, los retocás abajo.</p>`
      + color("sobre.frente", "Frente (las solapas de los costados)") + color("sobre.solapa", "Solapa de arriba (la que se abre)") + color("sobre.tinta", "Letras del sobre (\"Para…\")")
      + color("sobre.tap", "Color de \"Tocá para abrir\"") + campo("sobre.tapTexto", "Texto debajo del sobre"))
    + grupo("El lacre (el sello del medio)", elegir("sobre.lacreTipo", "Qué lleva", { letras: "Letras o números", logo: "El logo (se sube en Imágenes)" }, true)
      + (F.sobre.lacreTipo === "logo" ? (F.imagenes.logo ? "" : `<p class="aviso">Todavía no subiste un logo. Hacelo en la pestaña Imágenes.</p>`) : campo("sobre.lacreTexto", "Letras (iniciales, edad, etc.)")
        + elegir("sobre.lacreLetra", "Tipo de letra", { titulo: "La de los títulos", texto: "La de los textos", detalle: "La de los detalles" }) + rango("sobre.lacreTam", "Tamaño", .8, 3.2, .1, " rem"))
      + elegir("sobre.lacreEstilo", "Terminación", { brillo: "Con brillo (como lacre de verdad)", plano: "Color liso", mitad: "Mitad y mitad (dos colores)" }, true)
      + color("sobre.lacre", "Color del lacre") + (F.sobre.lacreEstilo === "mitad" ? color("sobre.lacre2", "Segundo color") : "") + color("sobre.lacreTinta", "Color de las letras del lacre")) ],
  imagenes: ["Imágenes", () => grupo("Foto de la portada", imagen("imagenes.portada", "Foto principal", 1400, "jpeg", "Se achica sola para que la invitación cargue rápido.")
      + elegir("imagenes.forma", "Forma", { arco: "Arco (redondeada arriba)", circulo: "Círculo", rect: "Rectángulo", libre: "Como es la foto" })
      + rango("imagenes.ancho", "Ancho", 30, 100, 1, "%") + tilde("imagenes.borde", "Con borde y sombra")
      + `<p class="ayuda">Dónde va (arriba o abajo de los nombres) se elige en Secciones → Portada.</p>`)
    + grupo("Logo", imagen("imagenes.logo", "Logo (mejor en PNG con fondo transparente)", 700, "png") + rango("imagenes.logoTam", "Alto del logo en la portada", 30, 200, 1, " px"),
      "Se puede mostrar arriba de la portada, en el cierre y en el lacre del sobre.")
    + grupo("Imagen de fondo", imagen("imagenes.fondo", "Imagen que queda quieta detrás de todo", 1400, "jpeg") + rango("imagenes.fondoOp", "Qué tanto se ve", 3, 100, 1, "%"),
      "Conviene bajita (10 a 25%) para que se lea bien el texto.") ],
  adornos: ["Adornos", () => grupo("Adornos del fondo", elegir("deco.tipo", "Tipo", ADORNOS, true)
      + (F.deco.tipo === "ninguna" ? "" : `<div class="f"><span>Colores de los adornos</span><div class="botones">${(F.deco.colores || []).map((c, i) => `<span class="der" style="display:flex;gap:4px;align-items:center"><input type="color" data-p="deco.colores.${i}" value="${c}" style="width:40px;height:30px;border:1px solid var(--linea);border-radius:6px;padding:2px">${F.deco.colores.length > 1 ? `<button class="b out chico" type="button" data-quitarcolor="${i}" title="Quitar">×</button>` : ""}</span>`).join("")}${(F.deco.colores || []).length < 5 ? `<button class="b out chico" type="button" data-accion="masColor">+ color</button>` : ""}</div></div>`
        + rango("deco.op", "Qué tanto se ven", 5, 100, 1, "%") + (F.deco.tipo === "abanicos" ? "" : rango("deco.cant", "Cantidad", .3, 3, .1, "×"))))
    + grupo("Música al abrir el sobre", elegir("musica", "Melodía", Object.fromEntries(Object.entries(MUSICAS).map(([k, v]) => [k, v[0]]))),
      "Suena cuando el invitado abre el sobre, y la puede apagar con el botón redondo. Para escucharla acá, tocá \"Ver cómo se abre el sobre\" y abrilo.") ],
  secciones: ["Secciones", () => {
    const n = F.secciones.length;
    const lista = F.secciones.map((s, i) => {
      const fija = FIJAS.includes(s.tipo), extremo = s.tipo === "portada" || s.tipo === "pie";
      const puedeSubir = !extremo && i > 1, puedeBajar = !extremo && i < n - 2;
      const nombre = s.titulo || s.nombre || s.texto || TIPOS_SECCION[s.tipo];
      return `<div class="sec${s.activa === false ? " apagada" : ""}" data-id="${s.id}">
        <div class="sec-cab" data-abrir="${s.id}">
          ${fija ? "" : `<input type="checkbox" data-p="secciones.${i}.activa" data-re ${s.activa === false ? "" : "checked"} title="Mostrar u ocultar" onclick="event.stopPropagation()">`}
          <span class="nom">${esc(String(nombre).split("\n")[0].slice(0, 40))}<br><span class="tipo">${TIPOS_SECCION[s.tipo]}</span></span>
          <button type="button" data-mover="${i}" data-dir="-1" ${puedeSubir ? "" : "disabled"} title="Subir">↑</button>
          <button type="button" data-mover="${i}" data-dir="1" ${puedeBajar ? "" : "disabled"} title="Bajar">↓</button>
          ${fija ? "" : `<button type="button" data-borrar="${i}" title="Borrar">🗑</button>`}
        </div>
        ${abierta === s.id ? `<div class="sec-cuerpo">${editorSeccion(s, i)}</div>` : ""}
      </div>`;
    }).join("");
    const agregables = Object.entries(TIPOS_SECCION).filter(([k]) => !FIJAS.includes(k) && !(UNICAS.includes(k) && F.secciones.some(s => s.tipo === k)));
    return grupo("Partes de la invitación", lista, "Tocá una parte para editarla. La casilla la muestra u oculta; las flechas cambian el orden. La portada, la confirmación y el cierre van siempre.")
      + grupo("Agregar una parte", `<div class="f"><select id="nuevaSeccion">${agregables.map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select></div><div class="botones"><button class="b chico" type="button" data-accion="agregarSeccion">Agregar</button></div>`);
  } ],
  datos: ["Datos", () => grupo("Fecha y lugar (para la cuenta regresiva y \"Agendar\")", `<div class="fila">${campo("evento.fecha", "Día", "date")}${campo("evento.hora", "Hora", "time")}</div>
      <div class="fila">${campo("evento.fechaFin", "Termina el día", "date")}${campo("evento.horaFin", "a la hora", "time")}</div>`
      + campo("evento.titulo", "Nombre del evento en el calendario") + campo("evento.lugarAgenda", "Lugar en el calendario")
      + campo("evento.horaFiesta", "Hora de la fiesta (para invitados \"solo fiesta\")", "time"))
    + grupo("Cómo le habla a los invitados", elegir("tono", "Trato", { vos: "De vos (\"Confirmá\", \"Te esperamos\")", usted: "De usted (\"Confirme\", \"Lo esperamos\")" }, true)
      + campo("secciones." + F.secciones.findIndex(s => s.tipo === "portada") + ".saludo", "Saludo (antes del nombre del invitado)", "text", ` placeholder="${esc((TONOS[F.tono] || TONOS.vos).saludo)}"`))
    + grupo("Invitado de ejemplo (lo que se ve en la muestra)", `<div class="fila">${campo("evento.invitado", "Nombre")}${campo("evento.lugares", "Lugares", "number", ' min="1" max="20"')}</div>`)
    + grupo("¿Para qué es esta invitación?", elegir("evento.modo", "Tipo", { muestra: "Muestra para la página (con datos de ejemplo)", panel: "Cliente con panel (planilla de Google)", whatsapp: "Cliente plan Básico (confirman por WhatsApp)" }, true)
      + (F.evento.modo === "muestra" ? campo("evento.cinta", "Cartel de abajo (vacío = \"Modelo … · invitación de muestra\")")
        : F.evento.modo === "panel" ? campo("evento.planilla", "Dirección de la planilla (termina en /exec)", "url") + `<p class="ayuda">Es la misma dirección que pegás en el panel. Los invitados entran con su link personal (…html?i=CÓDIGO).</p>`
        : `<div class="fila">${campo("evento.whatsapp", "WhatsApp del cliente (con 549…)")}${campo("evento.maxLugares", "Máximo por invitado", "number", ' min="1" max="20"')}</div>`)
      + `<p class="ayuda">La vista previa de la derecha siempre muestra la versión de muestra. Este dato cambia solo el archivo que descargás.</p>`) ]
};

function editorSeccion(s, i){
  const p = k => `secciones.${i}.${k}`;
  const fondo = s.tipo === "portada" || s.tipo === "pie" ? "" : elegir(p("fondo"), "Fondo de esta parte", { "": "Automático (va alternando)", banda: "Con banda", sin: "Sin banda" });
  const cab = (s.tipo !== "pie" && s.tipo !== "portada") ? `<div class="fila">${campo(p("lab"), "Título chiquito")}${campo(p("titulo"), "Título")}</div>` : "";
  switch(s.tipo){
    case "portada": return tilde(p("marco"), "Con marco doble (estilo Gala)") + campo(p("arriba"), "Frase de arriba (ej: Nos casamos)")
      + elegir(p("arribaEstilo"), "Estilo de esa frase", { chico: "Mayúsculas chiquitas", titulo: "Con la letra de los títulos" })
      + campo(p("nombre"), "Nombres (Enter = otra línea)", "area") + rango(p("nombreTam"), "Tamaño de los nombres", 2, 8, .1, " rem")
      + campo(p("abajo"), "Frase debajo de los nombres (opcional)") + campo(p("fecha"), "Fecha como se muestra") + campo(p("frase"), "Frase de invitación", "area")
      + elegir(p("foto"), "Foto de portada", { arriba: "Arriba de los nombres", abajo: "Abajo de los nombres", no: "No mostrar" }) + tilde(p("logo"), "Mostrar el logo arriba (si subiste uno)");
    case "cuenta": return cab + campo(p("boton"), "Texto del botón") + fondo;
    case "cronograma": return cab + campo(p("sub"), "Frase debajo del título (opcional)")
      + (s.items || []).map((it, j) => `<div class="item"><button class="quitar" type="button" data-quitaritem="${i}.items.${j}">Quitar</button>
        <div class="fila">${campo(p(`items.${j}.hora`), "Hora")}${campo(p(`items.${j}.titulo`), "Qué pasa")}</div>${campo(p(`items.${j}.detalle`), "Detalle o lugar")}
        ${campo(p(`items.${j}.mapa`), "Dirección para el mapa (vacía = sin botón)")}${tilde(p(`items.${j}.parte`), "Solo para invitados completos (no \"solo fiesta\")")}</div>`).join("")
      + `<div class="botones"><button class="b out chico" type="button" data-masitem="${i}">+ Agregar horario</button></div>` + fondo;
    case "lugar": return cab + `<div class="fila">${campo(p("hora"), "Horario")}${campo(p("nombre"), "Nombre del lugar")}</div>` + campo(p("direccion"), "Dirección (se muestra)") + campo(p("mapa"), "Dirección para el mapa") + fondo;
    case "texto": return cab + campo(p("texto"), "Texto (dejá una línea vacía para separar párrafos)", "area") + tilde(p("tarjeta"), "Dentro de una tarjeta") + fondo;
    case "lista": return cab + campo(p("items"), "Puntos (uno por línea)", "area") + fondo;
    case "datos": return cab + campo(p("texto"), "Frase (opcional)", "area") + `<div class="fila">${campo(p("precio"), "Precio de tarjeta (opcional)")}${campo(p("precioDetalle"), "Aclaración del precio")}</div>`
      + (s.filas || []).map((f, j) => `<div class="item"><button class="quitar" type="button" data-quitaritem="${i}.filas.${j}">Quitar</button><div class="fila">${campo(p(`filas.${j}.etiqueta`), "Dato (ej: Alias)")}${campo(p(`filas.${j}.valor`), "Valor")}</div>${tilde(p(`filas.${j}.copiar`), "Con botón Copiar")}</div>`).join("")
      + `<div class="botones"><button class="b out chico" type="button" data-masfila="${i}">+ Agregar dato</button></div>` + campo(p("nota"), "Nota al final (opcional)", "area") + fondo;
    case "galeria": return cab + `<div class="galeria-ed">${(s.fotos || []).map((f, j) => `<div><img src="${f}" alt=""><button type="button" data-quitaritem="${i}.fotos.${j}" title="Quitar">×</button></div>`).join("")}</div>
      <div class="botones"><button class="b out chico" type="button" data-fotos="${i}">+ Agregar fotos</button></div><p class="ayuda">Cada foto suma peso. Con 4 a 8 alcanza.</p>` + fondo;
    case "album": return cab + campo(p("sub"), "Explicación", "area") + `<p class="ayuda">Funciona solo con planilla (plan con panel). En la muestra, el botón explica qué pasaría.</p>` + fondo;
    case "confirmacion": return cab + `<div class="fila">${campo(p("si"), "Botón de sí")}${campo(p("no"), "Botón de no")}</div>` + `<div class="fila">${campo(p("pregunta"), "Pregunta")}${campo(p("cantLabel"), "Pregunta de cantidad")}</div>`
      + tilde(p("chicos"), "Preguntar cuántos son chicos", true) + (s.chicos ? campo(p("chicosLabel"), "Pregunta de chicos") : "")
      + tilde(p("menu"), "Preguntar por menú especial", true) + (s.menu ? campo(p("menuOpciones"), "Opciones del menú (una por línea)", "area") : "")
      + tilde(p("extra"), "Agregar una pregunta propia (ej: institución, empresa, canción)", true)
      + (s.extra ? campo(p("extraLabel"), "La pregunta") + `<div class="fila">${campo(p("extraPanel"), "Cómo aparece en el panel")}${campo(p("extraEjemplo"), "Ejemplo gris (opcional)")}</div>` : "")
      + campo(p("mensajeLabel"), "Título del mensaje") + campo(p("fine"), "Letra chica de abajo")
      + `<p class="ayuda">Mensajes después de responder (vacío = los de siempre):</p>` + campo(p("nota"), "En la muestra: \"esta respuesta …\"", "text", ` placeholder="${esc((TONOS[F.tono] || TONOS.vos).nota)}"`)
      + `<div class="fila">${campo(p("graciasSi"), "Si viene", "text", ` placeholder="${esc((TONOS[F.tono] || TONOS.vos).graciasSi)}"`)}${campo(p("graciasNo"), "Si no viene", "text", ` placeholder="${esc((TONOS[F.tono] || TONOS.vos).graciasNo)}"`)}</div>` + fondo;
    case "pie": return campo(p("lab"), "Título chiquito") + campo(p("texto"), "Texto grande", "area") + tilde(p("logo"), "Mostrar el logo (si subiste uno)");
  }
  return "";
}

function pintarPestanas(){
  $("#pestanas").innerHTML = Object.entries(PESTANAS).map(([k, [t]]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === pestana}">${t}</button>`).join("");
}
function pintarLetrasEstudio(){
  let st = document.getElementById("letrasPropiasCss");
  if(!st){ st = document.createElement("style"); st.id = "letrasPropiasCss"; document.head.appendChild(st); }
  st.textContent = cssLetrasPropias(F, true);
}
function pintarPanel(){
  const sc = $("#panel").scrollTop;
  $("#panel").innerHTML = PESTANAS[pestana][1]();
  $("#panel").scrollTop = sc;
}

/* Guardado automático en esta compu */
let tGuardar = null;
function cambio(redibujar){
  pintarLetrasEstudio();
  if(redibujar) pintarPanel();
  clearTimeout(tGuardar); tGuardar = setTimeout(() => {
    const ok = guardar.poner("evocard-estudio-ficha", JSON.stringify(F));
    $("#guardado").textContent = ok ? "Guardado en esta compu" : "No entra en la compu: guardá la ficha";
  }, 500);
  programarVista();
}

/* Vista previa */
let tVista = null, conSobre = false;
function programarVista(){ clearTimeout(tVista); tVista = setTimeout(actualizarVista, 350); }
function actualizarVista(){
  const fr = $("#previa"); let y = 0;
  try{ y = fr.contentWindow ? fr.contentWindow.scrollY : 0; }catch(e){}
  const html = armarInvitacion(F, { vista: true, conSobre });
  const cs = conSobre;
  fr.onload = () => { try{ if(!cs) fr.contentWindow.scrollTo(0, y); }catch(e){} };
  fr.style.background = F.colores.fondo;
  fr.srcdoc = html;
  const kb = Math.round(new Blob([armarInvitacion(F)]).size / 1024);
  $("#peso").textContent = `Peso: ${kb >= 1024 ? (kb / 1024).toFixed(1) + " MB" : kb + " KB"}${kb > 2500 ? " · pesada, conviene sacar fotos" : ""}`;
}

/* Imágenes: se achican antes de guardarlas */
function achicar(archivo, max, formato){
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(archivo), im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(formato === "png" ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", .82)); };
    im.onerror = () => { URL.revokeObjectURL(url); mal(new Error("No se pudo leer esa imagen. Probá con JPG o PNG.")); };
    im.src = url;
  });
}
function pedirArchivos(multiple, alElegir){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.multiple = multiple;
  inp.onchange = () => alElegir([...inp.files]); inp.click();
}

function descargar(nombre, contenido, tipo){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([contenido], { type: tipo })); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const slug = t => String(t || "modelo").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\(copia\)/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "modelo";
function descargarInvitacion(){
  const e = F.evento;
  if(e.modo === "panel" && !/^https:\/\/script\.google\.com\/.+\/exec\/?$/.test((e.planilla || "").trim())){ pestana = "datos"; pintarPestanas(); pintarPanel(); toast("Falta la dirección de la planilla (la que termina en /exec), en la pestaña Datos.", 4200); return; }
  if(e.modo === "whatsapp" && String(e.whatsapp || "").replace(/\D/g, "").length < 10){ pestana = "datos"; pintarPestanas(); pintarPanel(); toast("Falta el WhatsApp del cliente, con código de país (549…), en la pestaña Datos.", 4200); return; }
  descargar(slug(F.nombre) + ".html", armarInvitacion(F), "text/html;charset=utf-8");
  toast(e.modo === "muestra" ? "Listo: se descargó la muestra." : "Listo: se descargó la invitación del cliente.");
}

function moverColorSobre(){ F.sobre.frente = aclarar(F.sobre.color, .08); F.sobre.solapa = oscurecer(F.sobre.color, .06); }

function iniciar(){
  let guardada = null;
  try{ guardada = JSON.parse(guardar.leer("evocard-estudio-ficha") || "null"); }catch(e){}
  F = guardada && guardada.version ? conIds(mezclarFicha(fichaBase(), Object.assign(guardada, { secciones: guardada.secciones }))) : conIds(fichaBase());
  if(guardada) $("#guardado").textContent = "Retomaste lo último que hiciste";
  pintarLetrasEstudio(); pintarPestanas(); pintarPanel(); actualizarVista();

  $("#pestanas").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(!b) return; pestana = b.dataset.tab; pintarPestanas(); pintarPanel(); $("#panel").scrollTop = 0; });

  const leer = el => el.type === "checkbox" ? (el.dataset.p.endsWith(".parte") ? (el.checked ? "cena" : "") : el.checked) : ("num" in el.dataset ? Number(el.value) : el.value);
  $("#panel").addEventListener("input", e => {
    const el = e.target; if(!el.dataset.p || el.tagName === "SELECT" || el.type === "checkbox") return;
    set(F, el.dataset.p, leer(el));
    if(el.type === "range") el.nextElementSibling.textContent = el.value + (el.dataset.u || "");
    if(el.type === "color" && el.previousElementSibling) el.previousElementSibling.textContent = el.value.toUpperCase();
    if(el.dataset.p === "sobre.color"){ moverColorSobre(); document.querySelectorAll('[data-p="sobre.frente"],[data-p="sobre.solapa"]').forEach(i => { i.value = get(F, i.dataset.p); i.previousElementSibling.textContent = i.value.toUpperCase(); }); }
    cambio(false);
  });
  $("#panel").addEventListener("change", e => {
    const el = e.target; if(!el.dataset.p) return;
    if(el.tagName === "SELECT" || el.type === "checkbox"){
      let v = leer(el); if(el.dataset.p.startsWith("letras.tituloPeso")) v = Number(v);
      set(F, el.dataset.p, v); cambio("re" in el.dataset || el.dataset.p.endsWith(".activa"));
    }
  });
  $("#panel").addEventListener("click", async e => {
    const t = e.target.closest("button,[data-abrir]"); if(!t) return;
    const d = t.dataset;
    if(d.abrir){ abierta = abierta === d.abrir ? null : d.abrir; pintarPanel(); return; }
    if(d.paleta){ Object.assign(F.colores, JSON.parse(JSON.stringify(Object.assign({ bandaOp:100, lineasOp:100, error:"#A0453C", oscuro:false, bandaEstilo:"lisa", tarjetaOp:100 }, MODELOS[d.paleta].f.colores)))); cambio(true); toast("Colores de " + MODELOS[d.paleta].nombre + " aplicados."); return; }
    if(d.mover){ const i = +d.mover, j = i + +d.dir; [F.secciones[i], F.secciones[j]] = [F.secciones[j], F.secciones[i]]; cambio(true); return; }
    if(d.borrar){ const i = +d.borrar; if(!confirmarBorrado(F.secciones[i])) return; F.secciones.splice(i, 1); cambio(true); return; }
    if(d.masitem){ F.secciones[+d.masitem].items.push({ hora:"", titulo:"", detalle:"", mapa:"", parte:"" }); cambio(true); return; }
    if(d.masfila){ F.secciones[+d.masfila].filas.push({ etiqueta:"", valor:"", copiar:true }); cambio(true); return; }
    if(d.quitaritem){ const ks = d.quitaritem.split("."), lista = get(F, "secciones." + ks.slice(0, -1).join(".")); lista.splice(+ks[ks.length - 1], 1); cambio(true); return; }
    if(d.quitarcolor){ F.deco.colores.splice(+d.quitarcolor, 1); cambio(true); return; }
    if(d.quitarletra){ const l = F.letrasPropias[+d.quitarletra];
      if(!confirm(`¿Quitar la letra ${l.nombre}?`)) return;
      F.letrasPropias.splice(+d.quitarletra, 1);
      for(const k of ["titulo", "texto", "detalle"]) if(F.letras[k] === l.nombre) F.letras[k] = k === "detalle" ? "DM Sans" : "Cormorant Garamond";
      pintarLetrasEstudio(); cambio(true); return; }
    if(d.sacar){ set(F, d.sacar, ""); cambio(true); return; }
    if(d.subir){ pedirArchivos(false, async ([a]) => { if(!a) return; try{ set(F, d.subir, await achicar(a, +d.max, d.fmt)); cambio(true); }catch(err){ toast(err.message); } }); return; }
    if(d.fotos){ pedirArchivos(true, async archivos => { const s = F.secciones[+d.fotos]; for(const a of archivos){ try{ s.fotos.push(await achicar(a, 1000, "jpeg")); }catch(err){ toast(err.message); } } cambio(true); }); return; }
    switch(d.accion){
      case "blanco": if(confirm("¿Empezar uno nuevo en blanco? Se reemplaza lo que tenés ahora.")){ F = conIds(Object.assign(fichaBase(), { letrasPropias: F.letrasPropias || [] })); abierta = null; cambio(true); toast("Listo, diseño nuevo en blanco."); } break;
      case "copiar": { const k = $("#elegirModelo").value; if(confirm(`¿Copiar el modelo ${MODELOS[k].nombre}? Se reemplaza lo que tenés ahora.`)){ F = Object.assign(fichaDeModelo(k), { letrasPropias: F.letrasPropias || [] }); abierta = null; cambio(true); toast("Copiaste " + MODELOS[k].nombre + ". Ya lo podés cambiar."); } break; }
      case "guardarFicha": descargar(slug(F.nombre) + ".evocard.json", JSON.stringify(F, null, 1), "application/json"); toast("Se descargó la ficha. Guardala en una carpeta tuya."); break;
      case "abrirFicha": $("#abrirFicha").click(); break;
      case "descargar": descargarInvitacion(); break;
      case "cargarLetra": {
        const inp = document.createElement("input"); inp.type = "file"; inp.multiple = true; inp.accept = ".ttf,.otf,.woff,.woff2,.zip";
        inp.onchange = async () => { const r = await cargarLetras([...inp.files]); pintarLetrasEstudio(); cambio(true);
          toast((r.agregadas ? (r.agregadas === 1 ? "Letra cargada. Elegila abajo (tiene una ★)." : r.agregadas + " letras cargadas. Elegilas abajo (tienen una ★).") : "No se cargó ninguna letra.") + (r.avisos.length ? " " + r.avisos.join(" ") : ""), 5000); };
        inp.click(); break;
      }
      case "masColor": F.deco.colores.push(F.colores.principal); cambio(true); break;
      case "agregarSeccion": {
        const tipo = $("#nuevaSeccion").value;
        const nueva = { cuenta: () => S.cuenta(), cronograma: () => S.crono("", "Cronograma", [["20:00", "Algo que pasa", "Lugar"]]), lugar: () => S.lugar("", "Dónde", "20 h", "Nombre del lugar", "Dirección"),
          texto: () => S.texto("", "Título", "Escribí acá el texto."), lista: () => S.lista("", "Para tener en cuenta", ["Primer punto", "Segundo punto"]),
          datos: () => S.datos("Regalos", "Regalos", "", [["Alias", "nombre.alias"]]), galeria: () => S.galeria(), album: () => S.album() }[tipo]();
        nueva.id = nuevoId();
        const pos = F.secciones.findIndex(s => s.tipo === "confirmacion");
        F.secciones.splice(pos < 0 ? F.secciones.length - 1 : pos, 0, nueva); abierta = nueva.id; cambio(true);
        toast("Agregada. Quedó antes de la confirmación: movela con las flechas."); break;
      }
    }
  });
  $("#abrirFicha").addEventListener("change", async e => {
    const a = e.target.files[0]; e.target.value = ""; if(!a) return;
    try{ const j = JSON.parse(await a.text()); if(!j.version || !j.secciones) throw 0; const antes = F.letrasPropias || []; F = conIds(mezclarFicha(fichaBase(), j)); F.secciones = conIds({ secciones: j.secciones }).secciones; F.letrasPropias = [...(F.letrasPropias || []), ...antes.filter(l => !(F.letrasPropias || []).some(x => x.nombre === l.nombre))]; abierta = null; cambio(true); toast("Ficha abierta: " + F.nombre); }
    catch(err){ toast("Ese archivo no es una ficha del Estudio."); }
  });
  $("#verSobre").addEventListener("click", () => { conSobre = true; actualizarVista(); conSobre = false; });
  $("#descargarArriba").addEventListener("click", descargarInvitacion);
}
let yaEntro = false; try{ yaEntro = sessionStorage.getItem("evoEstudio") === "1"; }catch(e){}
if(yaEntro) entrar();
function confirmarBorrado(s){ return confirm(`¿Borrar la parte "${TIPOS_SECCION[s.tipo]}"${s.titulo ? ` (${s.titulo})` : ""}?`); }
</script>
